name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bundled question bank
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          bank_path = Path("data/real-exams.json")
          assert bank_path.exists(), "完整题库文件缺失"

          data = json.loads(bank_path.read_text(encoding="utf-8"))
          papers = data.get("papers", []) if isinstance(data, dict) else data
          assert isinstance(papers, list) and len(papers) == 148, "真题篇目数量不是 148"

          for paper in papers:
              assert paper.get("id"), "存在缺少 id 的篇目"
              assert paper.get("passage"), f"篇目缺少 passage: {paper.get('id')}"
              questions = paper.get("questions") or []
              assert questions, f"篇目缺少题目: {paper.get('id')}"

          question_count = sum(len(paper.get("questions") or []) for paper in papers)
          assert question_count == 740, f"题目数量不是 740，实际为 {question_count}"

          demo_js = Path("data/demo.js").read_text(encoding="utf-8")
          assert "window.KY_DEMO" in demo_js and "questions" in demo_js

          for path in Path("docs").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))

          print(f"bundled question bank ok: {len(papers)} papers / {question_count} questions")
          PY
